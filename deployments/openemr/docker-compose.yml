services:
  mysql:
    image: mariadb:12.3.3
    container_name: openemr-mysql
    restart: unless-stopped
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - databasevolume:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/healthcheck.sh
        - --su-mysql
        - --connect
        - --innodb_initialized
      start_period: 1m
      interval: 30s
      timeout: 5s
      retries: 5

  openemr:
    image: openemr/openemr:8.5.0
    container_name: openemr
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - logvolume01:/var/log
      - sitevolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
      MYSQL_USER: openemr
      MYSQL_PASS: ${MYSQL_PASS:?Missing MYSQL_PASS}
      OE_USER: ${OE_USER:-admin}
      OE_PASS: ${OE_PASS:?Missing OE_PASS}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  databasevolume:
  logvolume01:
  sitevolume:
